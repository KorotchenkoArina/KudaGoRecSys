<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EventChoice - Оценивай события</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <span class="logo-icon">🎯</span>
                    <span class="logo-text">EventChoice</span>
                </h1>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-icon">📊</span>
                        <span class="stat-label">Оценено:</span>
                        <span class="stat-value" id="statsTotal">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">❤️</span>
                        <span class="stat-label">Лайков:</span>
                        <span class="stat-value" id="statsLikes">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">⏳</span>
                        <span class="stat-label">Осталось:</span>
                        <span class="stat-value" id="statsRemaining">0</span>
                    </div>
                    <button class="btn-profile" id="profileBtn">
                        👤
                    </button>
                    <button class="btn-reset" id="resetBtn">
                        🔄
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Состояние загрузки -->
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>Загрузка события...</p>
            </div>

            <!-- Состояние "нет событий" -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">🎉</div>
                <h2>Вы оценили все события!</h2>
                <p>Нажмите "Сбросить", чтобы начать заново</p>
                <button class="btn-reset-large" onclick="document.getElementById('resetBtn').click()">
                    🔄 Начать заново
                </button>
            </div>

            <!-- Карточка события -->
            <div id="cardContainer" class="card-container"></div>
        </main>

        <div class="action-buttons">
            <button id="dislikeBtn" class="action-btn dislike-btn">
                <span class="btn-icon">👎</span>
                <span class="btn-label">Дизлайк</span>
                <span class="shortcut">←</span>
            </button>
            <button id="likeBtn" class="action-btn like-btn">
                <span class="btn-icon">❤️</span>
                <span class="btn-label">Лайк</span>
                <span class="shortcut">→</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
