<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EventChoice - Выбери лучшее событие</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <span class="logo-icon">🎯</span>
                    <span class="logo-text">EventChoice</span>
                </h1>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-icon">📊</span>
                        <span class="stat-label">Сравнений:</span>
                        <span class="stat-value" id="comparisonsCount">0</span>
                    </div>
                    <button class="btn-profile" id="profileBtn">
                        <span>👤</span> Профиль
                    </button>
                    <button class="btn-reset" id="resetBtn">
                        <span class="btn-icon">🔄</span>
                        Сбросить
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Область сравнения -->
            <div id="comparisonArea" class="comparison-area">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Загрузка событий...</p>
                </div>
            </div>

            <!-- Область результатов -->
            <div id="resultsArea" class="results-area" style="display: none;">
                <div class="results-header">
                    <h2>
                        <span class="results-icon">🏆</span>
                        Ваши рекомендации
                    </h2>
                    <p class="results-description">
                        На основе ваших сравнений мы подобрали лучшие события:
                    </p>
                </div>
                <div id="recommendations" class="recommendations-grid"></div>
                <button class="btn-continue" id="continueBtn">
                    <span class="btn-icon">🎲</span>
                    Продолжить выбор
                </button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
